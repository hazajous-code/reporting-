# GitHub 권장 패턴: configure-pages + upload-pages-artifact + deploy-pages@v5
# 참고: https://github.com/actions/starter-workflows/blob/main/pages/nextjs.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 중인 실행을 취소하면 사이트가 비는 경우가 있어 false 권장
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install & Build
        working-directory: client
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          test -f dist/.nojekyll || touch dist/.nojekyll

      - name: Verify site root
        run: |
          test -f client/dist/index.html
          test -f client/dist/404.html
          ls -la client/dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - id: deployment
        uses: actions/deploy-pages@v5
